# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "chatclient-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Matrix chat for sicompass: rooms, messages and members as lists, as a plugin"
repository = "https://github.com/friendlyflow/chatclient-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The client is the library, which
# the unit tests use.
[[bin]]
name = "chatclient-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
# The Matrix client-server API is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The HTTP to the homeserver. rustls (ring) with bundled roots, so the static
# musl build needs no system TLS library.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# TEMPORARY, until sicompass-sdk 0.9.1 is on crates.io: the SDK commit with the
# plugin kit (`plugin` feature), by git rev. Remove this section at the release.
[patch.crates-io]
sicompass-sdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "60dfd27f7c0949ea8d22fe41d0a331c38ed65ae3" }
